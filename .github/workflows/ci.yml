name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (compileall)
        run: python -m compileall -q flagforge tests

      - name: Unit tests (unittest)
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          flagforge validate --file examples/flags.yaml
          flagforge list --file examples/flags.yaml
          flagforge eval new-checkout --file examples/flags.yaml -c targetingKey=smoke-user
        shell: bash
